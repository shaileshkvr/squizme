services:
  postgres:
    image: postgres:16-alpine
    container_name: squizme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: squizme
    ports:
      - "5432:5432"
    volumes:
      - squizme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squizme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  squizme_pgdata:
    name: squizme_pgdata
